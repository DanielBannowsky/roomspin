<!DOCTYPE html><html><head><meta charset="utf-8"><title>Roomspin tests</title>
<link rel="stylesheet" href="../styles.css"></head><body>
<div class="ladder" id="ladder"></div><span id="verTag"></span><span id="scoreTag"></span>
<main id="main"></main><nav id="nav"></nav>
<input type="file" id="importer" style="display:none">
<h1 style="font:600 18px system-ui;margin:16px">Roomspin test harness</h1>
<pre id="out" style="font:12px ui-monospace,monospace;padding:0 16px 40px;line-height:1.6"></pre>
<script src="../js/constants.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/logic.js"></script>
<script src="../js/state.js"></script>
<script src="../js/app.js"></script>
<script src="../js/wheel.js"></script>
<script src="../js/spin.js"></script>
<script src="../js/render-rooms.js"></script>
<script src="../js/render-spin.js"></script>
<script src="../js/render-week.js"></script>
<script src="../js/render-progress.js"></script>
<script src="../js/render-settings.js"></script>
<script src="../js/io.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/wire.js"></script>
<script type="module">
const log=[]; let fails=0;
async function main(){
function ok(name,cond,extra){ if(cond) log.push("PASS  "+name); else { fails++; log.push("FAIL  "+name+(extra?"  :: "+extra:"")); } }
function tryIt(name,fn){ try{ fn(); log.push("PASS  "+name); }catch(e){ fails++; log.push("FAIL  "+name+" :: "+e.message+"\n"+e.stack); } }

localStorage.clear();

// --- boot / seed ---
load();
ok("seeds starter rooms", store.rooms.length===STARTER_ROOMS.length, store.rooms.length);
ok("seed rating is 5", store.rooms.every(r=>r.rating===5));
ok("house score 5.0", houseScore()===5);
ok("seeded flag set", store.seeded===true);

// deliberately empty the house and reload: seed must NOT come back
store.rooms=[]; save(); load();
ok("no re-seed after user empties list", store.rooms.length===0);

localStorage.clear(); load();

// --- rooms / ratings ---
const kitchen=store.rooms.find(r=>r.name==="Kitchen");
const garage=store.rooms.find(r=>r.name==="Garage");
setRating(kitchen,2); setRating(garage,9);
ok("setRating stores value", kitchen.rating===2);
setRating(kitchen,99); ok("rating clamps high", kitchen.rating===10);
setRating(kitchen,-4); ok("rating clamps low", kitchen.rating===0);
setRating(kitchen,6.5); ok("half points stored", kitchen.rating===6.5);
setRating(kitchen,6.3); ok("snaps to nearest half (down)", kitchen.rating===6.5);
setRating(kitchen,6.1); ok("snaps to nearest half (to 6)", kitchen.rating===6);
setRating(kitchen,"7.5"); ok("string input snaps", kitchen.rating===7.5);
setRating(kitchen,NaN); ok("NaN falls back to 5 rather than poisoning averages", kitchen.rating===5);
ok("fmtRating drops .0 on whole numbers", fmtRating(7)==="7" && fmtRating(7.5)==="7.5");
ok("snapRating handles undefined", snapRating(undefined)===5);
setRating(kitchen,2);
ok("one ratingLog entry per day", kitchen.ratingLog.filter(e=>e.date===todayStr()).length===1, JSON.stringify(kitchen.ratingLog));

// --- weighting ---
store.settings.bias=2;
ok("worse room outweighs better", roomWeight(kitchen)>roomWeight(garage));
ok("weight formula (11-r)^bias", roomWeight(kitchen)===Math.pow(9,2) && roomWeight(garage)===Math.pow(2,2));
setRating(garage,8.5);
ok("half-point rating weights between its neighbours", roomWeight(garage)===Math.pow(2.5,2), roomWeight(garage));
setRating(garage,9);
store.settings.bias=0;
ok("bias 0 = uniform weight", roomWeight(kitchen)===roomWeight(garage) && roomWeight(kitchen)===1);
store.settings.bias=2;
const ten=store.rooms[3]; setRating(ten,10);
ok("10/10 room still has non-zero weight", roomWeight(ten)>0, roomWeight(ten));

// odds sum to 1 and are sorted descending
const odds=spinOdds();
const sum=odds.reduce((a,o)=>a+o.p,0);
ok("odds sum to 1", Math.abs(sum-1)<1e-9, sum);
ok("odds sorted desc", odds.every((o,i)=>i===0||odds[i-1].p>=o.p));
ok("worst room has top odds", odds[0].room.id===kitchen.id, odds[0].room.name);

// --- empirical distribution check: 60k draws, worst room must dominate ---
const counts={}; const N=60000;
for(let i=0;i<N;i++){ const r=pickWeighted(); counts[r.id]=(counts[r.id]||0)+1; }
const kExp=odds.find(o=>o.room.id===kitchen.id).p;
const kObs=counts[kitchen.id]/N;
ok("empirical freq matches weighted odds (kitchen)", Math.abs(kObs-kExp)<0.02, "exp "+kExp.toFixed(3)+" obs "+kObs.toFixed(3));
const gExp=odds.find(o=>o.room.id===garage.id).p;
const gObs=(counts[garage.id]||0)/N;
ok("empirical freq matches weighted odds (garage)", Math.abs(gObs-gExp)<0.02, "exp "+gExp.toFixed(3)+" obs "+gObs.toFixed(3));
ok("every pool room gets drawn sometimes", spinPool().every(r=>counts[r.id]>0));

// --- wheel geometry ---
const wodds=spinOdds(); const wedges=wheelWedges(wodds);
ok("wedges cover exactly 360 degrees", Math.abs((wedges[wedges.length-1].a1 - wedges[0].a0) - 360)<1e-6,
   (wedges[wedges.length-1].a1 - wedges[0].a0));
ok("wedges start under the needle at -90", Math.abs(wedges[0].a0+90)<1e-9);
ok("wedges are contiguous", wedges.every((w,i)=>i===0||Math.abs(w.a0-wedges[i-1].a1)<1e-9));
ok("wedge sweep is proportional to probability", wedges.every(w=>Math.abs(w.sweep-w.p*360)<1e-9));
ok("worst room owns the biggest wedge",
   wedges.reduce((a,b)=>a.sweep>b.sweep?a:b).id===kitchen.id);
tryIt("wheelSvg renders for a normal pool",()=>{ const svg=wheelSvg(wodds,0); if(!/<path/.test(svg)) throw new Error("no wedges"); });
tryIt("wheelSvg renders for a one-room pool",()=>{
  const one=[{room:store.rooms[0],weight:1,p:1}];
  const svg=wheelSvg(one,0);
  if(!/<path/.test(svg)) throw new Error("no ring drawn");
  if(/NaN/.test(svg)) throw new Error("NaN in path data");
});
tryIt("wheelSvg never emits NaN coordinates",()=>{ if(/NaN/.test(wheelSvg(wodds,37.5))) throw new Error("NaN in path"); });
ok("wheel labels escape room names", !wheelSvg([{room:{id:"z",name:'<b>x</b>',rating:1},p:1,weight:1}],0).includes("<b>x</b>"));

// landing maths: the chosen wedge must end up under the needle at -90 (mod 360)
(function(){
  let worst=0;
  wedges.forEach(w=>{
    const cur=123.4;
    const need=(((-90 - w.mid - cur) % 360) + 360) % 360;
    const target=cur + 360*4 + need;                    // centre landing, no jitter
    const final=((target + w.mid + 90) % 360 + 360) % 360;
    worst=Math.max(worst, Math.min(final, 360-final));
  });
  ok("landing angle puts the winning wedge under the needle", worst<1e-6, worst);
})();

// --- snooze / pool ---
garage.snoozed=true;
ok("snoozed room leaves the pool", !spinPool().some(r=>r.id===garage.id));
garage.snoozed=false;

// --- avoid-repeat, incl. the two-room fallback ---
store.settings.avoidRepeat=true;
store.history=[{roomId:kitchen.id, roomName:"Kitchen"}];
ok("avoidRepeat excludes last week's room", !spinPool().some(r=>r.id===kitchen.id));
const savedRooms=store.rooms;
store.rooms=[kitchen];                      // one-room house: excluding it would empty the pool
ok("avoidRepeat falls back when pool would be empty", spinPool().length===1);
ok("pickWeighted survives single-room pool", pickWeighted().id===kitchen.id);
store.rooms=savedRooms; store.history=[];

// all rooms at 10 -> total weight still positive, pick still works
const backup=store.rooms.map(r=>r.rating);
store.rooms.forEach(r=>{r.rating=10;});
ok("pickWeighted works with a perfect house", !!pickWeighted());
store.rooms.forEach((r,i)=>{r.rating=backup[i];});

// --- tasks ---
addTask(kitchen,"regrout backsplash"); addTask(kitchen,"fix drawer slide"); addTask(kitchen,"   ");
ok("blank task rejected", kitchen.tasks.length===2, kitchen.tasks.length);
ok("open task count", openTasks(kitchen)===2);
toggleTask(kitchen,kitchen.tasks[0].id);
ok("toggle marks done + stamps date", kitchen.tasks[0].done===true && kitchen.tasks[0].doneAt===todayStr());
ok("done/open counts split", doneTasks(kitchen)===1 && openTasks(kitchen)===1);
toggleTask(kitchen,kitchen.tasks[0].id);
ok("untoggle clears doneAt", kitchen.tasks[0].doneAt===null);
toggleTask(kitchen,kitchen.tasks[0].id);

// --- week lifecycle ---
store.settings.weekLength=7;
startWeek(kitchen);
ok("week records start rating", store.week.startRating===kitchen.rating);
ok("week end date is +7", store.week.endDate===addDays(store.week.startDate,7));
ok("days left = 7 on day one", weekDaysLeft()===7);
ok("week not over on day one", weekIsOver()===false);
store.week.endDate=todayStr();
ok("weekIsOver when end date is today", weekIsOver()===true);
endWeek(6);
ok("history row written", store.history.length===1);
ok("history captures delta", store.history[0].startRating===2 && store.history[0].endRating===6, JSON.stringify(store.history[0]));
ok("history counts tasks ticked this week", store.history[0].tasksDone===1, store.history[0].tasksDone);
ok("room rating updated on close-out", kitchen.rating===6);
ok("week cleared after close-out", store.week===null);

// deleting the week's room must not strand the week
startWeek(garage); deleteRoom(garage.id);
ok("deleting the active room clears the week", store.week===null);
ok("room actually deleted", !roomById(garage.id));

// --- house trend ---
const dates=houseTrendDates();
ok("trend dates present", dates.length>=1);
ok("houseScoreOn(today) matches houseScore", Math.abs(houseScoreOn(todayStr())-houseScore())<1e-9);
ok("houseScoreOn before any room existed is null", houseScoreOn("1999-01-01")===null);

// --- persistence round trip ---
save();
const snapshot=JSON.stringify(store);
store=null; load();
ok("store survives save/load", store.rooms.length>0 && store.history.length===1);
ok("round trip is lossless", JSON.stringify(store)===snapshot);

// --- corrupt data handling ---
localStorage.setItem(KEY,"{not json");
loadError=false; load();
ok("corrupt data flags loadError", loadError===true);
ok("corrupt data is preserved for recovery", localStorage.getItem(KEY+"-corrupt-backup")==="{not json");
ok("corrupt data does not crash render", typeof renderRooms()==="string");

// --- hand-mangled shapes (wrong types where arrays are expected) ---
localStorage.setItem(KEY, JSON.stringify({rooms:[{id:"x",name:"Odd",rating:"7",tasks:null,ratingLog:"nope"}], history:"nope", week:{roomId:"ghost"}}));
loadError=false; load();
ok("string rating coerced to number", store.rooms[0].rating===7);
ok("null tasks normalised to array", Array.isArray(store.rooms[0].tasks));
ok("bad ratingLog rebuilt", Array.isArray(store.rooms[0].ratingLog) && store.rooms[0].ratingLog.length===1);
ok("bad history normalised", Array.isArray(store.history));
ok("week pointing at a missing room is dropped", store.week===null);

// --- import validation ---
ok("rejects non-backup json", validBackup({foo:1})===false);
ok("rejects null", validBackup(null)===false);
ok("rejects rooms of wrong shape", validBackup({rooms:[{nope:1}]})===false);
ok("accepts a real backup", validBackup(JSON.parse(snapshot))===true);
ui.pendingImport={data:JSON.parse(snapshot)};
applyImport();
ok("import restores rooms", store.rooms.length>0);
ok("import clears pending flag", ui.pendingImport===null);

// --- render every tab, in every notable state, and assert no throw ---
const tabs=["rooms","spin","week","progress","settings"];
tabs.forEach(t=>tryIt("render "+t+" (week running)",()=>{ ui.tab=t; startWeek(store.rooms[0]); render(); if(!$main.innerHTML.trim()) throw new Error("empty output"); }));
store.week=null;
tabs.forEach(t=>tryIt("render "+t+" (no week)",()=>{ ui.tab=t; render(); if(!$main.innerHTML.trim()) throw new Error("empty output"); }));
tryIt("render room detail",()=>{ ui.tab="rooms"; ui.openRoomId=store.rooms[0].id; render(); if(!$main.querySelector("#roomName")) throw new Error("no detail view"); });
ui.openRoomId=null;
tryIt("render odds table open",()=>{ ui.tab="spin"; ui.oddsOpen=true; render(); });
tryIt("render close-out panel",()=>{ startWeek(store.rooms[0]); ui.tab="week"; ui.endWeekOpen=true; ui.endWeekRating=8; render(); if(!$main.querySelector("[data-endslider]")) throw new Error("no sign-off slider"); });
ui.endWeekOpen=false; store.week=null;
tryIt("render with zero rooms",()=>{ const s=store.rooms; store.rooms=[]; store.history=[]; tabs.forEach(t=>{ui.tab=t;render();}); store.rooms=s; });
tryIt("render with one room",()=>{ const s=store.rooms; store.rooms=[s[0]]; tabs.forEach(t=>{ui.tab=t;render();}); store.rooms=s; });
tryIt("render with every room snoozed",()=>{ store.rooms.forEach(r=>r.snoozed=true); ui.tab="spin"; render(); store.rooms.forEach(r=>r.snoozed=false); });

// --- escaping: a room name with markup must not become markup ---
localStorage.clear(); load();
const evil=addRoom('<img src=x onerror=alert(1)>"&');
addTask(evil,'<script>bad()<\/script>');
ui.tab="rooms"; ui.openRoomId=evil.id; render();
ok("room name escaped in detail", !$main.innerHTML.includes("<img src=x"));
ok("task text escaped", !$main.innerHTML.includes("<script>bad()"));
ui.openRoomId=null; ui.tab="rooms"; render();
ok("room name escaped in list", !$main.innerHTML.includes("<img src=x"));

// --- wire(): the handlers actually attach and mutate state ---
ui.tab="rooms"; ui.openRoomId=null; render();
tryIt("nav buttons wired",()=>{ if($nav.querySelectorAll("[data-tab]").length!==5) throw new Error("nav count"); });
const r0=store.rooms[0];
ui.openRoomId=r0.id; ui.tab="rooms"; render();
const before=r0.rating;
$main.querySelector("[data-rate='0.5']").click();
ok("plus button raises by a half point", store.rooms[0].rating===Math.min(10,before+0.5), before+" -> "+store.rooms[0].rating);
$main.querySelector("[data-rate='-0.5']").click();
ok("minus button lowers by a half point", store.rooms[0].rating===before);
const sl=$main.querySelector("[data-rateslider]");
ok("rating slider is rendered", !!sl);
ok("slider steps in half points", sl.step==="0.5" && sl.min==="0" && sl.max==="10");
sl.value="3.5"; sl.dispatchEvent(new Event("input"));
ok("slider drag updates the rating live", store.rooms[0].rating===3.5);
sl.value="8.5"; sl.dispatchEvent(new Event("change"));
ok("slider release commits the rating", store.rooms[0].rating===8.5);
ok("committed rating is logged", store.rooms[0].ratingLog.some(e=>e.rating===8.5));
const tcount=(store.rooms[0].tasks||[]).length;
$main.querySelector("#newTask").value="painted trim";
$main.querySelector("#addTaskBtn").click();
ok("add-task button adds a task", store.rooms[0].tasks.length===tcount+1);
const tid=store.rooms[0].tasks[store.rooms[0].tasks.length-1].id;
$main.querySelector("[data-toggletask='"+tid+"']").click();
ok("checkbox toggles the task", store.rooms[0].tasks.find(t=>t.id===tid).done===true);
$main.querySelector("[data-deltask='"+tid+"']").click();
ok("first delete tap only arms", store.rooms[0].tasks.some(t=>t.id===tid) && ui.confirmDelTask===tid);
$main.querySelector("[data-deltask='"+tid+"']").click();
ok("second delete tap removes", !store.rooms[0].tasks.some(t=>t.id===tid));
$main.querySelector("#snoozeRoom").click();
ok("snooze button toggles", store.rooms[0].snoozed===true);
$main.querySelector("#snoozeRoom").click();
$main.querySelector("#roomName").value="   ";
$main.querySelector("#roomName").dispatchEvent(new Event("change"));
ok("blank rename refused", store.rooms[0].name.trim().length>0, store.rooms[0].name);
ui.openRoomId=null;

// settings wiring
ui.tab="settings"; render();
$main.querySelector("[data-bias='3']").click();
ok("bias chip updates setting", store.settings.bias===3);
const wl=store.settings.weekLength;
$main.querySelector("[data-weeklen='1']").click();
ok("week length stepper", store.settings.weekLength===wl+1);
$main.querySelector("#toggleRepeat").click();
ok("repeat toggle flips", store.settings.avoidRepeat===false);
// changing week length while a week runs must move its end date
store.settings.avoidRepeat=true; startWeek(store.rooms[0]); ui.tab="settings"; render();
const oldEnd=store.week.endDate;
$main.querySelector("[data-weeklen='1']").click();
ok("live week end date follows the setting", store.week.endDate!==oldEnd && store.week.endDate===addDays(store.week.startDate,store.settings.weekLength));
store.week=null;

// sign-off slider end to end
startWeek(store.rooms[0]); store.rooms[0].rating=4; ui.tab="week"; ui.endWeekOpen=true; ui.endWeekRating=4; render();
const esl=$main.querySelector("[data-endslider]");
ok("sign-off slider rendered", !!esl);
esl.value="7.5"; esl.dispatchEvent(new Event("input"));
ok("sign-off slider updates the pending rating", ui.endWeekRating===7.5);
$main.querySelector("[data-endnudge='-0.5']").click();
ok("sign-off nudge steps a half point", ui.endWeekRating===7);
const hLen=store.history.length;
$main.querySelector("#confirmEnd").click();
ok("sign-off writes a history row", store.history.length===hLen+1);
ok("history keeps the half-point rating", store.history[0].endRating===7);
ok("sign-off applies the rating to the room", roomById(store.history[0].roomId).rating===7);
ok("sign-off sends you back to the spin", ui.tab==="spin" && store.week===null);

// spin wiring: the landed result is the one that starts the week
ui.tab="spin"; resetSpin(); render();
ui.spin={phase:"landed", cursor:0, resultId:store.rooms[0].id, pool:store.rooms.map(r=>r.id)};
render();
$main.querySelector("#startWeek").click();
ok("Start-the-week uses the landed room", store.week && store.week.roomId===store.rooms[0].id);
ok("starting a week moves you to the Week tab", ui.tab==="week");
store.week=null; resetSpin();

// --- no template hole should reach the screen ---
localStorage.clear(); load();
{
  const gg=store.rooms[0];
  addTask(gg,"a task"); startWeek(gg);
  const views=[["rooms",null],["spin",null],["week",null],["progress",null],["settings",null],["rooms",gg.id]];
  views.forEach(([t,openId])=>{
    ui.tab=t; ui.openRoomId=openId; ui.oddsOpen=true; render();
    const html=$main.innerHTML;
    const holes=["undefined","[object Object]","NaN","null%"].filter(h=>html.includes(h));
    ok("no template holes on "+t+(openId?" (detail)":""), holes.length===0, holes.join(", "));
  });
  // and the sync panel in both of its states
  ui.tab="settings"; ui.openRoomId=null; render();
  ok("sync setup form renders whole", !$main.innerHTML.includes("undefined"));
  saveSyncConfig({owner:"o",repo:"r",path:"p.json",token:"t",lastSync:Date.now()});
  render();
  ok("connected sync panel renders whole", !$main.innerHTML.includes("undefined"));
  ok("connected panel does not print the token", !$main.innerHTML.includes(">t<") && !$main.innerHTML.includes('value="t"'));
  clearSyncConfig();
  store.week=null; ui.oddsOpen=false;
}

// --- every interactive control must be styled and hit a 44px touch target ---
// Catches the whole class of "markup migrated everywhere except here" bugs: a control that
// lost its class renders at the browser default (~20px) instead of the design system's size,
// which no amount of state-assertion would notice.
localStorage.clear(); load();
const g=roomById(store.rooms[0].id);
addTask(g,"a task"); startWeek(g);
["rooms","spin","week","progress","settings"].forEach(t=>{
  ui.tab=t; ui.openRoomId = t==="rooms" ? g.id : null; render();
  // A control passes if its own box is 44px tall, or if it expands its touch target with an
  // ::after overlay (the Material pattern for chips, which are 32px by spec).
  const effectiveHeight=el=>{
    const own=el.getBoundingClientRect().height;
    const after=parseFloat(getComputedStyle(el,"::after").height)||0;
    return Math.max(own, after);
  };
  const small=[...$main.querySelectorAll("button, input:not([type=range]), textarea")]
    .filter(el=>el.offsetParent!==null)
    .map(el=>({el, h:effectiveHeight(el)}))
    .filter(x=>x.h < 44)
    .map(x=>x.el.tagName.toLowerCase()+"#"+(x.el.id||"-")+"."+(x.el.className||"none")+" h="+x.h.toFixed(0));
  ok("all controls meet the 44px touch target on the "+t+" tab", small.length===0, small.join(" | "));
  const unstyled=[...$main.querySelectorAll("button, input, textarea")]
    .filter(el=>!el.className && !el.closest(".field"))
    .map(el=>el.tagName.toLowerCase()+"#"+(el.id||"-"));
  ok("no unstyled controls on the "+t+" tab", unstyled.length===0, unstyled.join(" | "));
});
store.week=null; ui.openRoomId=null;



// ============================ design pillars ============================
localStorage.clear(); load();
{
  ok("ten pillars", PILLARS.length===10, PILLARS.length);
  ok("pillar keys unique", new Set(PILLARS.map(p=>p.key)).size===10);
  ok("repair comes first, not last", PILLARS[0].key==="repair");
  ok("the sufficiency hole is filled", PILLARS.some(p=>p.key==="function"));
  ok("nothing owns the fixed planes was fixed", PILLARS.some(p=>p.key==="surfaces"));
  ok("soft goods split out of texture", PILLARS.some(p=>p.key==="textiles"));
  ok("character became art", PILLARS.some(p=>p.key==="art") && !PILLARS.some(p=>p.key==="character"));
  ok("every pillar has a hint", PILLARS.every(p=>p.hint && p.hint.length>20));
  ok("every pillar has a colour token", PILLARS.every(p=>{
    const el=document.createElement("div"); el.style.color=`var(--pil-${p.key})`;
    document.body.appendChild(el); const c=getComputedStyle(el).color; el.remove();
    return c && c!=="rgba(0, 0, 0, 0)";
  }));

  // The tagger, on the exact items this house failed to tag under the old nine.
  const wasUntagged=[["Steps","function"],["Hose thing","function"],["Dumbbells","function"],
    ["Scratching stuff","function"],["Baking soda","comfort"]];
  wasUntagged.forEach(([text,want])=>{
    ok(`previously untagged "${text}" now lands on ${want}`, suggestPillar(text)===want, suggestPillar(text));
  });
  // And the two live collisions the reviewers found.
  ok("Shelves is storage, not texture", suggestPillar("Shelves")==="storage", suggestPillar("Shelves"));
  ok("a rug is textiles", suggestPillar("New rug")==="textiles", suggestPillar("New rug"));
  ok("a fan is comfort", suggestPillar("Fan")==="comfort");
  ok("horse mats read as a fixed plane", suggestPillar("Horse mats")==="textiles" || suggestPillar("Horse mats")==="surfaces");
  ok("paint is surfaces", suggestPillar("Wallpaper")==="surfaces" && suggestPillar("paint the ceiling")==="surfaces");
  ok("a curtain is light, not textiles", suggestPillar("Shades")==="light");
  ok("furniture nouns moved to function", suggestPillar("Place for eating")==="function");
  ok("layout keeps the verbs", suggestPillar("rearrange the seating so it faces the fire")==="layout",
     suggestPillar("rearrange the seating so it faces the fire"));
  ok("storage owns subtraction", suggestPillar("get rid of the exercise bike")==="storage");
  ok("best-match beats first-match",
     suggestPillar("paint the ceiling and touch up around the fan")==="surfaces",
     suggestPillar("paint the ceiling and touch up around the fan"));
  ok("no rule produces a dead key", PILLAR_HINTS.every(([k])=>!!pillarBy(k)));

  // Migration off the old nine.
  ok("legacy color -> surfaces", migratePillar({text:"zzz",pillar:"color"})==="surfaces");
  ok("legacy texture re-reads from text", migratePillar({text:"New rug",pillar:"texture"})==="textiles");
  ok("legacy character -> art", migratePillar({text:"zzz",pillar:"character"})==="art");
  ok("a surviving key is left alone", migratePillar({text:"anything",pillar:"storage"})==="storage");
  ok("untagged stays untagged", migratePillar({text:"zzz",pillar:null})===null);

  // Coverage counts, and never claims the room is good.
  const r=store.rooms[0];
  addTask(r,"paint the ceiling");
  ok("coverage counts the tagged item", pillarCoverage(r).find(c=>c.pillar.key==="surfaces").total===1);
  ok("pillarTotal is ten by default", pillarTotal(r)===10);
  ui.openRoomId=r.id; ui.tab="rooms"; render();
  ok("grid renders one tile per pillar", $main.querySelectorAll(".ptile").length===10,
     $main.querySelectorAll(".ptile").length);
  ok("tiles show a count, never the word done", !$main.innerHTML.includes(">done<"));
  ok("the copy does not claim the room is good",
     !/room is good|reads as finished/i.test($main.innerHTML));
  ok("the copy says nothing forgotten instead",
     /forgotten|have something against them/i.test($main.innerHTML));

  // "Not for this room" — the change all three reviewers called required.
  ok("a hollow pillar offers the dismiss control", !!$main.querySelector('[data-natoggle="greenery"]'));
  ok("a covered pillar does not", !$main.querySelector('[data-natoggle="surfaces"]'));
  $main.querySelector('[data-natoggle="greenery"]').click();
  ok("dismissing removes it from the room's set", !pillarsFor(roomById(r.id)).some(p=>p.key==="greenery"));
  ok("and shrinks the denominator", pillarTotal(roomById(r.id))===9, pillarTotal(roomById(r.id)));
  ok("dismissed pillars are not scored", !pillarCoverage(roomById(r.id)).some(c=>c.pillar.key==="greenery"));
  render();
  ok("it can be put back", !!$main.querySelector('[data-natoggle="greenery"]'));
  $main.querySelector('.narow [data-natoggle="greenery"]').click();
  ok("putting it back restores the denominator", pillarTotal(roomById(r.id))===10);
  ok("dismissals survive a reload", (()=>{
    togglePillarNA(roomById(r.id),"art"); save(); store=null; load();
    return naPillars(roomById(r.id)).includes("art");
  })());
  ok("dismissals merge between phones", (()=>{
    const mine=JSON.parse(JSON.stringify(store));
    const hers=JSON.parse(JSON.stringify(store));
    const rid=r.id;
    hers.rooms.find(x=>x.id===rid).naPillars=["art","greenery"];
    hers.rooms.find(x=>x.id===rid).updatedAt=(store.clock||Date.now())+9000;
    return mergeStores(mine,hers).rooms.find(x=>x.id===rid).naPillars.length===2;
  })());
  togglePillarNA(roomById(r.id),"art");
  ui.openRoomId=null;
}

// ============================ shared house (sync) ============================
// The merge is a pure function, so these drive it directly with two hand-built "devices"
// rather than going through the network.
const T0=Date.now()-60000, T1=T0+1000, T2=T0+2000;
function applyMergedForTest(m){ store=deepMerge(freshDefaults(), m); normalizeStore(); save(); }
function dev(over){
  return Object.assign({version:1, seeded:true, settings:{bias:2,weekLength:7,avoidRepeat:true},
    settingsUpdatedAt:0, week:null, weekUpdatedAt:0, history:[],
    graveyard:{rooms:{},tasks:{}}, rooms:[]}, over||{});
}
const room=(id,over)=>Object.assign({id, name:id, rating:5, tasks:[], notes:"", snoozed:false,
  createdAt:"2026-01-01", ratingLog:[{date:"2026-01-01",rating:5}], updatedAt:T0}, over||{});
const task=(id,over)=>Object.assign({id, text:id, done:false, doneAt:null,
  createdAt:"2026-01-01", updatedAt:T0}, over||{});

// 1. Concurrent edits to *different* fields of the same room must both survive — this is the
//    whole reason the merge is per-field rather than last-document-wins.
{
  const mine =dev({rooms:[room("kitchen",{rating:4, updatedAt:T1,
                    tasks:[task("t1",{done:true, doneAt:"2026-02-02", updatedAt:T1})]})]});
  const hers =dev({rooms:[room("kitchen",{notes:"paint = Alabaster", updatedAt:T2,
                    tasks:[task("t1"), task("t2",{updatedAt:T2})]})]});
  const m=mergeStores(mine,hers);
  const k=m.rooms.find(r=>r.id==="kitchen");
  ok("merge: her later room edit wins the room fields", k.notes==="paint = Alabaster");
  ok("merge: my ticked task survives her concurrent edit", k.tasks.find(t=>t.id==="t1").done===true);
  ok("merge: her new task survives too", !!k.tasks.find(t=>t.id==="t2"));
  ok("merge: no duplicate tasks", k.tasks.length===2, k.tasks.length);
}

// 2. Same field on both sides: later stamp wins, in both directions.
{
  const a=dev({rooms:[room("bath",{rating:3, updatedAt:T1})]});
  const b=dev({rooms:[room("bath",{rating:9, updatedAt:T2})]});
  ok("merge: later rating wins (a,b)", mergeStores(a,b).rooms[0].rating===9);
  ok("merge: later rating wins (b,a)", mergeStores(b,a).rooms[0].rating===9);
}

// 3. Deletions stick rather than being resurrected by the other device's stale copy.
{
  const deleter=dev({graveyard:{rooms:{garage:T2},tasks:{}}, rooms:[]});
  const holder =dev({rooms:[room("garage",{updatedAt:T1})]});
  ok("merge: deleted room stays deleted", mergeStores(deleter,holder).rooms.length===0);
  ok("merge: deletion is order-independent", mergeStores(holder,deleter).rooms.length===0);
}
// 4. ...unless the other device edited it *after* the delete — then the edit is the later intent.
{
  const deleter=dev({graveyard:{rooms:{garage:T1},tasks:{}}, rooms:[]});
  const editor =dev({rooms:[room("garage",{rating:8, updatedAt:T2})]});
  const m=mergeStores(deleter,editor);
  ok("merge: an edit after the delete revives the room", m.rooms.length===1 && m.rooms[0].rating===8);
}
// 5. Task tombstones behave the same way.
{
  const a=dev({rooms:[room("k",{tasks:[]})], graveyard:{rooms:{},tasks:{t9:T2}}});
  const b=dev({rooms:[room("k",{tasks:[task("t9",{updatedAt:T1})]})]});
  ok("merge: deleted task stays deleted", mergeStores(a,b).rooms[0].tasks.length===0);
}
// 6. Rooms added independently on each device are unioned.
{
  const a=dev({rooms:[room("a1")]}), b=dev({rooms:[room("b1")]});
  const ids=mergeStores(a,b).rooms.map(r=>r.id).sort();
  ok("merge: rooms added on both devices are kept", ids.join()==="a1,b1", ids.join());
}
// 7. History is append-only and must not duplicate.
{
  const h=x=>({id:x, roomId:"r", roomName:"R", startDate:"2026-01-01", endDate:"2026-01-0"+x,
               startRating:2, endRating:4, tasksDone:1, tasksTotal:2});
  const a=dev({history:[h(1),h(2)]}), b=dev({history:[h(2),h(3)]});
  const m=mergeStores(a,b);
  ok("merge: history unions without duplicates", m.history.length===3, m.history.length);
  ok("merge: history sorted newest first", m.history[0].id===3, m.history[0].id);
}
// 8. Week and settings resolve by their own stamps.
{
  const wk={id:"w",roomId:"kitchen",startDate:"2026-02-01",endDate:"2026-02-08",startRating:3};
  const a=dev({rooms:[room("kitchen")], week:null, weekUpdatedAt:T2});
  const b=dev({rooms:[room("kitchen")], week:wk,  weekUpdatedAt:T1});
  ok("merge: newer 'week closed' beats older open week", mergeStores(a,b).week===null);
  const c=dev({rooms:[room("kitchen")], week:wk, weekUpdatedAt:T2});
  const d=dev({rooms:[room("kitchen")], week:null, weekUpdatedAt:T1});
  ok("merge: newer open week beats older closed", mergeStores(c,d).week!==null);
  const e=dev({settings:{bias:3,weekLength:14,avoidRepeat:false}, settingsUpdatedAt:T2});
  const f=dev({settings:{bias:0,weekLength:7,avoidRepeat:true}, settingsUpdatedAt:T1});
  ok("merge: newer settings win", mergeStores(e,f).settings.bias===3);
}
// 9. A week whose room the other device deleted must not strand the Job tab.
{
  const a=dev({rooms:[], graveyard:{rooms:{gone:T2},tasks:{}}, weekUpdatedAt:T1,
               week:{id:"w",roomId:"gone",startDate:"2026-02-01",endDate:"2026-02-08",startRating:3}});
  const b=dev({rooms:[room("gone",{updatedAt:T1})], weekUpdatedAt:T1});
  ok("merge: week pointing at a deleted room is cleared", mergeStores(a,b).week===null);
}
// 10. ratingLog is one entry per date, later device wins a shared date.
{
  const a=dev({rooms:[room("k",{updatedAt:T2, ratingLog:[{date:"2026-01-01",rating:5},{date:"2026-02-01",rating:8}]})]});
  const b=dev({rooms:[room("k",{updatedAt:T1, ratingLog:[{date:"2026-02-01",rating:2},{date:"2026-03-01",rating:6}]})]});
  const log=mergeStores(a,b).rooms[0].ratingLog;
  ok("merge: ratingLog unions by date", log.length===3, log.length);
  ok("merge: later device wins a shared date", log.find(e=>e.date==="2026-02-01").rating===8);
  ok("merge: ratingLog stays sorted", log.map(e=>e.date).join()==="2026-01-01,2026-02-01,2026-03-01");
}
// 11. Ancient tombstones are pruned so the shared file can't grow forever.
{
  const old=Date.now()-200*24*3600*1000;
  const a=dev({graveyard:{rooms:{ancient:old, recent:Date.now()},tasks:{}}});
  const g=mergeStores(a,dev()).graveyard.rooms;
  ok("merge: old tombstones are pruned", !("ancient" in g) && ("recent" in g));
}
// 12b. Clock skew: an edit made after seeing the other device's future-dated change must win.
{
  const future=Date.now()+10*60*1000;      // her phone runs ten minutes fast
  localStorage.clear(); load();
  const r0=store.rooms[0];
  const hers=dev({clock:future, rooms:[{...r0, rating:9, updatedAt:future, tasks:[]}]});
  applyMergedForTest(mergeStores(stripRuntime(store), hers));
  ok("clock: merge adopts the higher clock", store.clock>=future, store.clock);
  setRating(roomById(r0.id), 2);           // my genuinely-later edit, on a correct clock
  ok("clock: my later edit outranks her fast clock", roomById(r0.id).updatedAt>future);
  const back=mergeStores(stripRuntime(store), hers);
  ok("clock: and survives the next merge", back.rooms.find(x=>x.id===r0.id).rating===2,
     back.rooms.find(x=>x.id===r0.id).rating);
}

// 12. Merging is idempotent — re-syncing unchanged data must not churn the file.
{
  const a=dev({rooms:[room("k",{tasks:[task("t1")]})], history:[]});
  const b=dev({rooms:[room("k",{tasks:[task("t1")]})]});
  const once=mergeStores(a,b), twice=mergeStores(once,b);
  ok("merge: idempotent", JSON.stringify(once)===JSON.stringify(twice));
}
// 13. base64 must survive the free text people actually type.
{
  const weird='Kid’s room — café 🏠 "quotes" & <tags>';
  ok("sync: base64 round-trips unicode", b64decode(b64encode(weird))===weird);
  ok("sync: base64 tolerates GitHub's wrapped output",
     b64decode(b64encode(weird).replace(/(.{4})/g,"$1\n"))===weird);
}

// ---- the full cycle, against a stubbed GitHub ----
{
  const realFetch=window.fetch;
  let remoteFile=null, remoteSha=null, puts=0, failNextPut=false;
  window.fetch=async(url,opts)=>{
    const u=String(url);
    if(!/api\.github\.com/.test(u)) return realFetch(url,opts);
    if(!opts || !opts.method || opts.method==="GET"){
      if(remoteFile===null) return {ok:false, status:404, json:async()=>({message:"Not Found"})};
      return {ok:true, status:200, json:async()=>({content:b64encode(JSON.stringify(remoteFile)), sha:remoteSha})};
    }
    if(opts.method==="PUT"){
      puts++;
      const body=JSON.parse(opts.body);
      if(failNextPut){ failNextPut=false; return {ok:false, status:409, json:async()=>({message:"conflict"})}; }
      if(remoteSha && body.sha!==remoteSha) return {ok:false, status:409, json:async()=>({message:"stale sha"})};
      remoteFile=JSON.parse(b64decode(body.content));
      remoteSha="sha"+puts;
      return {ok:true, status:200, json:async()=>({content:{sha:remoteSha}})};
    }
    return {ok:false, status:500, json:async()=>({message:"unexpected"})};
  };
  const cfg={owner:"someone", repo:"roomspin-sync", path:"roomspin.json", token:"tok"};
  await (async()=>{
    localStorage.clear(); load();
    const k=store.rooms.find(r=>r.name==="Kitchen");
    setRating(k,3);
    await connectSync(cfg);
    ok("sync: connect creates the remote file", remoteFile!==null);
    ok("sync: connect stores the config", isSynced()===true);
    ok("sync: remote carries our rooms", remoteFile.rooms.length===store.rooms.length);
    ok("sync: token is NOT in the synced payload", !JSON.stringify(remoteFile).includes("tok"));
    ok("sync: token is NOT in the app's own store", !JSON.stringify(store).includes("tok"));

    // Her phone edits the shared file directly while this device is idle.
    const kid=k.id;
    remoteFile.rooms=remoteFile.rooms.map(r=> r.id===kid
      ? {...r, notes:"she added this", updatedAt:Date.now()+5000,
         tasks:[{id:"hers", text:"call the plumber", done:false, doneAt:null,
                 createdAt:todayStr(), updatedAt:Date.now()+5000}]}
      : r);
    // Meanwhile this device ticks something of its own.
    addTask(roomById(kid),"my own task");
    const mineId=roomById(kid).tasks.find(t=>t.text==="my own task").id;

    await syncNow({quiet:true});
    const merged=roomById(kid);
    ok("sync: her edit arrives on this device", merged.notes==="she added this");
    ok("sync: her task arrives", !!merged.tasks.find(t=>t.id==="hers"));
    ok("sync: my concurrent task is not lost", !!merged.tasks.find(t=>t.id===mineId));
    ok("sync: remote ends up with both tasks",
       remoteFile.rooms.find(r=>r.id===kid).tasks.length===2,
       remoteFile.rooms.find(r=>r.id===kid).tasks.length);

    // A stale-sha collision should be retried, not surfaced as an error.
    failNextPut=true;
    setRating(roomById(kid),7);
    await syncNow({quiet:true});
    ok("sync: a 409 is retried and still lands", sync.status==="ok", sync.status+" / "+sync.detail);
    ok("sync: retried write reached the remote", remoteFile.rooms.find(r=>r.id===kid).rating===7,
       "remote="+remoteFile.rooms.find(r=>r.id===kid).rating+" local="+roomById(kid).rating+" puts="+puts);

    // Returning to the foreground must pull her changes without anyone tapping anything —
    // resuming an installed PWA does not reload the page, so this is the only trigger that
    // fires in that case.
    {
      const kid2=kid;
      remoteFile.rooms=remoteFile.rooms.map(r=> r.id===kid2
        ? {...r, notes:"edited while my app sat open", updatedAt:(remoteFile.clock||Date.now())+9000}
        : r);
      remoteFile.clock=(remoteFile.clock||Date.now())+9000;
      const cfgNow=syncConfig(); cfgNow.lastSync=Date.now()-60000; saveSyncConfig(cfgNow);
      document.dispatchEvent(new Event("visibilitychange"));
      await new Promise(r=>setTimeout(r,120));
      ok("sync: foreground refresh pulls her change with no tap",
         roomById(kid2).notes==="edited while my app sat open", roomById(kid2).notes);
    }

    // Disconnecting must leave the local copy intact and stop touching the network.
    const before=puts;
    disconnectSync();
    ok("sync: disconnect clears the config", isSynced()===false);
    setRating(roomById(kid),4);
    await new Promise(r=>setTimeout(r,50));
    ok("sync: no writes after disconnect", puts===before, puts+" vs "+before);
    ok("sync: local data survives disconnect", roomById(kid).rating===4);
  })();
  window.fetch=realFetch;
  localStorage.removeItem(SYNC_KEY);
}

// --- DEFAULTS must never be handed out by reference (regression: reset produced 30 rooms) ---
localStorage.clear(); load();
ok("store does not alias DEFAULTS.rooms", store.rooms!==DEFAULTS.rooms);
ok("store does not alias DEFAULTS.history", store.history!==DEFAULTS.history);
ok("seeding leaves DEFAULTS untouched", DEFAULTS.rooms.length===0, DEFAULTS.rooms.length);
const seedN=store.rooms.length;
resetAll(); ok("reset once gives the starter set", store.rooms.length===seedN, store.rooms.length);
resetAll(); resetAll();
ok("repeated resets do not duplicate rooms", store.rooms.length===seedN, store.rooms.length);
store.history.push({id:"x"});
ok("history writes do not leak into DEFAULTS", DEFAULTS.history.length===0);
store.history=[];

// --- the sign-off panel replaces the live rating panel rather than sitting alongside it ---
localStorage.clear(); load();
startWeek(store.rooms[0]); ui.tab="week"; ui.endWeekOpen=false; render();
ok("live rating slider shows while the week runs", !!$main.querySelector("[data-rateslider]"));
ui.endWeekOpen=true; ui.endWeekRating=5; render();
ok("live rating slider is hidden during sign-off", !$main.querySelector("[data-rateslider]"));
ok("only one rating panel on screen at a time", $main.querySelectorAll(".ratepanel").length===1);
ui.endWeekOpen=false; store.week=null;

// --- full cycle, driven the way a person would: spin, work, sign off ---
localStorage.clear(); load();
store.settings.avoidRepeat=false;
const startScore=houseScore();
ui.tab="spin"; render();
startSpin();                                   // reduced-motion path resolves synchronously here
ok("a spin produces a result", !!ui.spin && !!ui.spin.resultId);
const picked=roomById(ui.spin.resultId);
ok("the result is a real room in the pool", !!picked && spinPool().some(r=>r.id===picked.id));
if(ui.spin.phase==="landed"){
  render();
  $main.querySelector("#startWeek").click();
  ok("cycle: week opened on the spun room", store.week && store.week.roomId===picked.id);
  addTask(picked,"paint the ceiling"); addTask(picked,"replace the outlet");
  ui.tab="week"; render();
  $main.querySelectorAll("[data-toggletask]").forEach(b=>b.click());
  ok("cycle: both punch items ticked", openTasks(roomById(picked.id))===0);
  ui.endWeekOpen=true; ui.endWeekRating=8.5; render();
  $main.querySelector("#confirmEnd").click();
  ok("cycle: week closed into history", store.history.length===1 && store.history[0].roomId===picked.id);
  ok("cycle: both items counted in the history row", store.history[0].tasksDone===2, store.history[0].tasksDone);
  ok("cycle: room carries the new rating", roomById(picked.id).rating===8.5);
  ok("cycle: house score went up", houseScore()>startScore, startScore+" -> "+houseScore());
  ok("cycle: the spin is free again", store.week===null);
} else {
  // The animated path is timer-driven; assert the intermediate state is at least coherent.
  ok("cycle: spinning state carries a target angle", typeof ui.spin.target==="number");
}
resetSpin();

}
// Surface a thrown error instead of rendering a blank page — a suite that silently prints
// nothing is worse than one that fails loudly.
try{ await main(); }
catch(e){
  document.getElementById("out").textContent =
    log.join("\n") + "\n\nTHREW after " + log.length + " checks:\n" + (e && e.stack || e);
  document.title="THREW";
  throw e;
}
document.getElementById("out").textContent = log.join("\n")+"\n\n"+(fails?("FAILURES: "+fails):"ALL "+log.length+" CHECKS PASSED");
document.title = fails? ("FAIL:"+fails) : "OK";
</script></body></html>
